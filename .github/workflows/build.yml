name: Build VOID

on:
  workflow_dispatch:
    inputs:
      engine_profile:
        description: >-
          If you want to know the differences between Lite and Max, all details are provided in the README.
        type: choice
        required: true
        options:
          - Void Engine Lite — Lightweight
          - Void Engine Max — Full features
        default: Void Engine Lite — Lightweight
      build_macos:
        description: Build macOS DMG
        type: boolean
        required: false
        default: true
      build_windows:
        description: Build Windows packages
        type: boolean
        required: false
        default: true
      build_linux:
        description: Build Linux packages
        type: boolean
        required: false
        default: true
      build_android:
        description: Build Android APK
        type: boolean
        required: false
        default: true
      target_url:
        description: Website URL (blank loads the bundled local site)
        type: string
        required: false
        default: ''
      app_name:
        description: App name (leave blank to use the website domain)
        type: string
        required: false
        default: ''
      android_package:
        description: Android application ID (blank derives it from the app name)
        type: string
        required: false
        default: ''
      icon_url:
        description: Optional PNG or ICO icon URL (blank uses the site icon or a generated default)
        type: string
        required: false
        default: ''
      width:
        description: Initial window width
        type: string
        required: true
        default: '1200'
      height:
        description: Initial window height
        type: string
        required: true
        default: '780'
      version:
        description: App bundle version
        type: string
        required: true
        default: '1.0.0'
      fullscreen:
        description: Start in fullscreen mode
        type: boolean
        required: false
        default: false
      new_window:
        description: Allow opening links in separate windows
        type: boolean
        required: false
        default: false
      multi_arch:
        description: Use the universal macOS master binary (Intel + Apple Silicon)
        type: boolean
        required: false
        default: true
      hide_title_bar:
        description: Hide the title bar (macOS only)
        type: boolean
        required: false
        default: false
      windows_format:
        description: Windows packages to build
        type: choice
        required: true
        options: [exe, msi, both]
        default: both
      linux_format:
        description: Linux packages to build
        type: choice
        required: true
        options: [deb, appimage, both]
        default: both

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS DMG
    if: ${{ inputs.build_macos }}
    runs-on: macos-15
    steps:
      - name: Fetch source snapshot without Git checkout overhead
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/void-source.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --output "$archive" "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}"
          tar -xzf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
      - name: Prepare macOS app metadata, icon, and master binary
        id: configure
        env:
          APP_NAME: ${{ inputs.app_name }}
          TARGET_URL: ${{ inputs.target_url }}
          ANDROID_PACKAGE: ${{ inputs.android_package }}
          ICON_URL: ${{ inputs.icon_url }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
          APP_NEW_WINDOW: ${{ inputs.new_window }}
          APP_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          GH_TOKEN: ${{ github.token }}
          MASTER_BINARY_RELEASE_PREFIX: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'engine-master-max-' || 'engine-master-lite-' }}
          MASTER_BINARY_SOURCE_SHA: ${{ github.sha }}
          MASTER_BINARY_ASSET: ${{ inputs.multi_arch && (inputs.engine_profile == 'Void Engine Max — Full features' && 'void-engine-max-macos-universal' || 'void-engine-lite-macos-universal') || format('void-engine-{0}-macos-{1}', inputs.engine_profile == 'Void Engine Max — Full features' && 'max' || 'lite', runner.arch == 'ARM64' && 'aarch64' || 'x86_64') }}
          MASTER_BINARY_OUTPUT: target/master/void
          MASTER_TEMPLATE_ASSET: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'void-engine-max-macos-template.dmg' || 'void-engine-lite-macos-template.dmg' }}
          MASTER_TEMPLATE_OUTPUT: target/master/void-template.dmg
        run: node scripts/prepare-macos-build.mjs
      - name: Package macOS app and DMG
        env:
          APP_NAME: ${{ steps.configure.outputs.app_name }}
          APP_SLUG: ${{ steps.configure.outputs.app_slug }}
          APP_VERSION: ${{ inputs.version }}
          MASTER_BINARY_PATH: target/master/void
          MASTER_TEMPLATE_DMG: target/master/void-template.dmg
          ENGINE_PROFILE: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'max' || 'lite' }}
        run: bash scripts/package-macos-dmg.sh
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.configure.outputs.app_slug }}-macos-dmg
          path: output/*.dmg
          if-no-files-found: error

  build-windows-exe:
    name: Windows exe
    if: ${{ inputs.build_windows && (inputs.windows_format == 'exe' || inputs.windows_format == 'both') }}
    runs-on: windows-2025
    steps:
      - name: Fetch source snapshot without Git checkout overhead
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'void-source.tar.gz'
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/tarball/$env:GITHUB_SHA"
          & curl.exe --fail --location --silent --show-error --retry 3 `
            --header 'Accept: application/vnd.github+json' `
            --header "Authorization: Bearer $env:GH_TOKEN" `
            --output $archive $uri
          if ($LASTEXITCODE -ne 0) { throw "Could not download source snapshot (curl exit $LASTEXITCODE)" }
          & tar.exe -xzf $archive --strip-components=1 -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "Could not extract source snapshot (tar exit $LASTEXITCODE)" }
      - name: Prepare Windows app metadata, icon, and master binary
        id: configure
        env:
          APP_NAME: ${{ inputs.app_name }}
          TARGET_URL: ${{ inputs.target_url }}
          ANDROID_PACKAGE: ${{ inputs.android_package }}
          ICON_URL: ${{ inputs.icon_url }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
          APP_NEW_WINDOW: ${{ inputs.new_window }}
          APP_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          GH_TOKEN: ${{ github.token }}
          MASTER_BINARY_RELEASE_PREFIX: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'engine-master-max-' || 'engine-master-lite-' }}
          MASTER_BINARY_SOURCE_SHA: ${{ github.sha }}
          MASTER_BINARY_ASSET: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'void-engine-max-windows-x86_64.exe' || 'void-engine-lite-windows-x86_64.exe' }}
          MASTER_BINARY_OUTPUT: target/master/void.exe
        run: node scripts/prepare-windows-build.mjs
      - name: Apply per-app Windows executable icon
        shell: pwsh
        run: ./scripts/set-windows-icon.ps1 -Executable target/master/void.exe -IconFile branding/app.ico
      - name: Package Windows executable and config
        env:
          APP_SLUG: ${{ steps.configure.outputs.app_slug }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          Copy-Item -Force target/master/void.exe "output/$($env:APP_SLUG).exe"
          Copy-Item -Force void.json "output/$($env:APP_SLUG).json"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.configure.outputs.app_slug }}-windows-exe
          path: |
            output/${{ steps.configure.outputs.app_slug }}.exe
            output/${{ steps.configure.outputs.app_slug }}.json
          if-no-files-found: error

  build-windows-msi:
    name: Windows msi
    if: ${{ inputs.build_windows && (inputs.windows_format == 'msi' || inputs.windows_format == 'both') }}
    runs-on: windows-2025
    steps:
      - name: Fetch source snapshot without Git checkout overhead
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'void-source.tar.gz'
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/tarball/$env:GITHUB_SHA"
          & curl.exe --fail --location --silent --show-error --retry 3 `
            --header 'Accept: application/vnd.github+json' `
            --header "Authorization: Bearer $env:GH_TOKEN" `
            --output $archive $uri
          if ($LASTEXITCODE -ne 0) { throw "Could not download source snapshot (curl exit $LASTEXITCODE)" }
          & tar.exe -xzf $archive --strip-components=1 -C $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw "Could not extract source snapshot (tar exit $LASTEXITCODE)" }
      - name: Prepare Windows app metadata, icon, and master binary
        id: configure
        env:
          APP_NAME: ${{ inputs.app_name }}
          TARGET_URL: ${{ inputs.target_url }}
          ANDROID_PACKAGE: ${{ inputs.android_package }}
          ICON_URL: ${{ inputs.icon_url }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
          APP_NEW_WINDOW: ${{ inputs.new_window }}
          APP_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          GH_TOKEN: ${{ github.token }}
          MASTER_BINARY_RELEASE_PREFIX: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'engine-master-max-' || 'engine-master-lite-' }}
          MASTER_BINARY_SOURCE_SHA: ${{ github.sha }}
          MASTER_BINARY_ASSET: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'void-engine-max-windows-x86_64.exe' || 'void-engine-lite-windows-x86_64.exe' }}
          MASTER_BINARY_OUTPUT: target/master/void.exe
          MASTER_TEMPLATE_MSI_ASSET: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'void-engine-max-windows-template.msi' || 'void-engine-lite-windows-template.msi' }}
          MASTER_TEMPLATE_MSI_OUTPUT: target/master/void-template.msi
        run: node scripts/prepare-windows-build.mjs
      - name: Package Windows MSI
        env:
          APP_NAME: ${{ steps.configure.outputs.app_name }}
          APP_SLUG: ${{ steps.configure.outputs.app_slug }}
          APP_VERSION: ${{ inputs.version }}
          MASTER_BINARY_PATH: target/master/void.exe
          MASTER_TEMPLATE_MSI: target/master/void-template.msi
        shell: pwsh
        run: ./scripts/package-windows-msi.ps1
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.configure.outputs.app_slug }}-windows-msi
          path: output/${{ steps.configure.outputs.app_slug }}.msi
          if-no-files-found: error

  build-linux-deb:
    name: Linux deb
    if: ${{ inputs.build_linux && (inputs.linux_format == 'deb' || inputs.linux_format == 'both') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch source snapshot without Git checkout overhead
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/void-source.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --output "$archive" "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}"
          tar -xzf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
      - name: Prepare Linux app metadata, icon, and master binary
        id: configure
        env:
          APP_NAME: ${{ inputs.app_name }}
          TARGET_URL: ${{ inputs.target_url }}
          ANDROID_PACKAGE: ${{ inputs.android_package }}
          ICON_URL: ${{ inputs.icon_url }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
          APP_NEW_WINDOW: ${{ inputs.new_window }}
          APP_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          GH_TOKEN: ${{ github.token }}
          MASTER_BINARY_RELEASE_PREFIX: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'engine-master-max-' || 'engine-master-lite-' }}
          MASTER_BINARY_SOURCE_SHA: ${{ github.sha }}
          MASTER_BINARY_ASSET: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'void-engine-max-linux-x86_64' || 'void-engine-lite-linux-x86_64' }}
          MASTER_BINARY_OUTPUT: target/master/void
        run: node scripts/prepare-linux-build.mjs
      - name: Package Debian archive
        env:
          APP_NAME: ${{ steps.configure.outputs.app_name }}
          APP_SLUG: ${{ steps.configure.outputs.app_slug }}
          APP_VERSION: ${{ inputs.version }}
        run: bash scripts/package-linux-deb.sh target/master/void "output/${{ steps.configure.outputs.app_slug }}.deb"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.configure.outputs.app_slug }}-linux-deb
          path: output/*.deb
          if-no-files-found: error

  build-linux-appimage:
    name: Linux appimage
    if: ${{ inputs.build_linux && (inputs.linux_format == 'appimage' || inputs.linux_format == 'both') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Fetch source snapshot without Git checkout overhead
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/void-source.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --output "$archive" "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}"
          tar -xzf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
      - name: Prepare Linux app metadata, icon, and master binary
        id: configure
        env:
          APP_NAME: ${{ inputs.app_name }}
          TARGET_URL: ${{ inputs.target_url }}
          ANDROID_PACKAGE: ${{ inputs.android_package }}
          ICON_URL: ${{ inputs.icon_url }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
          APP_NEW_WINDOW: ${{ inputs.new_window }}
          APP_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          GH_TOKEN: ${{ github.token }}
          MASTER_BINARY_RELEASE_PREFIX: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'engine-master-max-' || 'engine-master-lite-' }}
          MASTER_BINARY_SOURCE_SHA: ${{ github.sha }}
          MASTER_BINARY_ASSET: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'void-engine-max-linux-x86_64' || 'void-engine-lite-linux-x86_64' }}
          MASTER_BINARY_OUTPUT: target/master/void
        run: node scripts/prepare-linux-build.mjs
      - name: Cache AppImage tool
        uses: actions/cache@v6.1.0
        continue-on-error: true
        with:
          path: .cache/appimagetool-x86_64.AppImage
          key: appimagetool-x86_64-v2
      - name: Package Linux AppImage
        env:
          APP_NAME: ${{ steps.configure.outputs.app_name }}
          APP_SLUG: ${{ steps.configure.outputs.app_slug }}
          APP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p output AppDir/usr/bin AppDir/usr/share/applications \
            AppDir/usr/share/icons/hicolor/256x256/apps \
            AppDir/usr/share/icons/hicolor/512x512/apps \
            AppDir/usr/share/metainfo .cache
          install -m 0755 target/master/void "AppDir/usr/bin/${APP_SLUG}"
          install -m 0644 void.json "AppDir/usr/bin/${APP_SLUG}.json"
          cp branding/icon.png "AppDir/${APP_SLUG}.png"
          cp branding/icon.png "AppDir/.DirIcon"
          cp branding/icon.png "AppDir/usr/share/icons/hicolor/256x256/apps/${APP_SLUG}.png"
          cp branding/icon.png "AppDir/usr/share/icons/hicolor/512x512/apps/${APP_SLUG}.png"
          cat > "AppDir/${APP_SLUG}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${APP_NAME}
          Comment=${APP_NAME} desktop application powered by VOID Engine
          Exec=${APP_SLUG}
          Icon=${APP_SLUG}
          StartupWMClass=${APP_SLUG}
          Categories=Utility;Network;
          Terminal=false
          EOF
          cp "AppDir/${APP_SLUG}.desktop" AppDir/usr/share/applications/
          cat > "AppDir/usr/share/metainfo/${APP_SLUG}.metainfo.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>com.void.${APP_SLUG}</id>
            <name>${APP_NAME}</name>
            <summary>${APP_NAME} desktop application</summary>
            <metadata_license>MIT</metadata_license>
            <project_license>MIT</project_license>
            <launchable type="desktop-id">${APP_SLUG}.desktop</launchable>
            <releases>
              <release version="${APP_VERSION}" date="2026-11-15"/>
            </releases>
          </component>
          EOF
          cat > AppDir/AppRun <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/${APP_SLUG}" "\$@"
          EOF
          chmod +x AppDir/AppRun
          if [ ! -f .cache/appimagetool-x86_64.AppImage ]; then
            curl --fail --location --silent --show-error \
              https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
              -o .cache/appimagetool-x86_64.AppImage
          fi
          chmod +x .cache/appimagetool-x86_64.AppImage
          ARCH=x86_64 .cache/appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir "output/${APP_SLUG}.AppImage"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.configure.outputs.app_slug }}-linux-appimage
          path: output/*.AppImage
          if-no-files-found: error

  build-android:
    name: Android APK
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-24.04
    env:
      CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
    steps:
      - name: Fetch source snapshot without Git checkout overhead
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/void-source.tar.gz"
          curl --fail --location --silent --show-error --retry 3 \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --output "$archive" "https://api.github.com/repos/${GITHUB_REPOSITORY}/tarball/${GITHUB_SHA}"
          tar -xzf "$archive" --strip-components=1 -C "$GITHUB_WORKSPACE"
      - name: Prepare Android app metadata, icon, and master APK
        id: configure
        env:
          APP_NAME: ${{ inputs.app_name }}
          TARGET_URL: ${{ inputs.target_url }}
          ANDROID_PACKAGE: ${{ inputs.android_package }}
          ICON_URL: ${{ inputs.icon_url }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
          APP_NEW_WINDOW: ${{ inputs.new_window }}
          APP_HIDE_TITLE_BAR: ${{ inputs.hide_title_bar }}
          GH_TOKEN: ${{ github.token }}
          MASTER_BINARY_RELEASE_PREFIX: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'engine-master-max-' || 'engine-master-lite-' }}
          MASTER_BINARY_SOURCE_SHA: ${{ github.sha }}
          MASTER_BINARY_ASSET: ${{ inputs.engine_profile == 'Void Engine Max — Full features' && 'void-engine-max-android-template.apk' || 'void-engine-lite-android-template.apk' }}
          MASTER_BINARY_OUTPUT: target/master/void-android-template.apk
        run: node scripts/prepare-android-build.mjs
      - name: Repackage app-specific Android APK via direct ZIP injection
        env:
          APP_NAME: ${{ steps.configure.outputs.app_name }}
          APP_SLUG: ${{ steps.configure.outputs.app_slug }}
          ANDROID_PACKAGE: ${{ steps.configure.outputs.android_package }}
          APP_VERSION: ${{ inputs.version }}
        run: bash scripts/package-android-master.sh target/master/void-android-template.apk "output/${{ steps.configure.outputs.app_slug }}.apk"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ steps.configure.outputs.app_slug }}-android-apk
          path: output/*.apk
          if-no-files-found: error
