name: Build VOID

on:
  workflow_dispatch:
    inputs:
      build_macos:
        description: Build macOS DMG
        type: boolean
        required: false
        default: true
      build_windows:
        description: Build Windows packages
        type: boolean
        required: false
        default: true
      build_linux:
        description: Build Linux packages
        type: boolean
        required: false
        default: true
      build_android:
        description: Build Android APK
        type: boolean
        required: false
        default: true
      target_url:
        description: Website URL (blank loads the bundled local site)
        type: string
        required: false
        default: ''
      app_name:
        description: App name (leave as void to use the website domain)
        type: string
        required: true
        default: void
      android_package:
        description: Android application ID (blank derives it from the app name)
        type: string
        required: false
        default: ''
      icon_url:
        description: Optional PNG or ICO icon URL (blank discovers the website favicon)
        type: string
        required: false
        default: ''
      width:
        description: Initial window width
        type: string
        required: true
        default: '1200'
      height:
        description: Initial window height
        type: string
        required: true
        default: '780'
      version:
        description: App bundle version
        type: string
        required: true
        default: '1.0.0'
      fullscreen:
        description: Start in fullscreen mode
        type: boolean
        required: false
        default: false
      new_window:
        description: Allow opening links in separate windows
        type: boolean
        required: false
        default: false
      multi_arch:
        description: Build a universal macOS binary
        type: boolean
        required: false
        default: false
      windows_format:
        description: Windows packages to build
        type: choice
        required: true
        options: [exe, msi, both]
        default: both
      linux_format:
        description: Linux packages to build
        type: choice
        required: true
        options: [deb, appimage, both]
        default: both

permissions:
  contents: read

jobs:
  build-macos:
    name: macOS DMG
    if: ${{ inputs.build_macos }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      - name: Configure app metadata
        id: configure
        env:
          APP_NAME: ${{ inputs.app_name }}
          TARGET_URL: ${{ inputs.target_url }}
          ANDROID_PACKAGE: ${{ inputs.android_package }}
          ICON_URL: ${{ inputs.icon_url }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
          APP_NEW_WINDOW: ${{ inputs.new_window }}
        run: node scripts/configure-build.mjs

      - name: Discover and prepare app icon
        env:
          TARGET_URL: ${{ inputs.target_url }}
          ICON_URL: ${{ inputs.icon_url }}
        run: node scripts/prepare-branding.mjs

      - name: Install Rust stable toolchain
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ inputs.multi_arch && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos

      - name: Install cargo-bundle
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle

      - name: Build macOS binary
        env:
          MULTI_ARCH: ${{ inputs.multi_arch }}
        run: |
          if [ "$MULTI_ARCH" = "true" ]; then
            cargo build --release --bin void --target x86_64-apple-darwin
            cargo build --release --bin void --target aarch64-apple-darwin
            mkdir -p target/release
            lipo -create -output target/release/void \
              target/x86_64-apple-darwin/release/void \
              target/aarch64-apple-darwin/release/void
          else
            cargo build --release --bin void
          fi

      - name: Package macOS app and DMG
        env:
          APP_NAME: ${{ steps.configure.outputs.app_name }}
          APP_SLUG: ${{ steps.configure.outputs.app_slug }}
          APP_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p output dmg_staging
          if cargo bundle --release --bin void --format osx --binary-path target/release/void; then
            bundle_path=$(find target/release/bundle/osx -maxdepth 1 -name '*.app' -print -quit)
            test -n "$bundle_path"
            staged_app="dmg_staging/${APP_NAME}.app"
            cp -R "$bundle_path" "$staged_app"
            mkdir -p "$staged_app/Contents/Resources" "$staged_app/Contents/MacOS"
            cp void.json "$staged_app/Contents/Resources/void.json"
            cp void.json "$staged_app/Contents/MacOS/void.json"
          else
            app_contents="dmg_staging/${APP_NAME}.app/Contents"
            mkdir -p "$app_contents/MacOS" "$app_contents/Resources/AppIcon.iconset"
            cp target/release/void "$app_contents/MacOS/${APP_NAME}"
            cp void.json "$app_contents/MacOS/void.json"
            cp void.json "$app_contents/Resources/void.json"
            chmod +x "$app_contents/MacOS/${APP_NAME}"
            for size in 16 32 128 256 512; do
              sips -z "$size" "$size" branding/icon.png --out "$app_contents/Resources/AppIcon.iconset/icon_${size}x${size}.png" >/dev/null
            done
            sips -z 32 32 branding/icon.png --out "$app_contents/Resources/AppIcon.iconset/icon_16x16@2x.png" >/dev/null
            sips -z 64 64 branding/icon.png --out "$app_contents/Resources/AppIcon.iconset/icon_32x32@2x.png" >/dev/null
            sips -z 256 256 branding/icon.png --out "$app_contents/Resources/AppIcon.iconset/icon_128x128@2x.png" >/dev/null
            sips -z 512 512 branding/icon.png --out "$app_contents/Resources/AppIcon.iconset/icon_256x256@2x.png" >/dev/null
            sips -z 1024 1024 branding/icon.png --out "$app_contents/Resources/AppIcon.iconset/icon_512x512@2x.png" >/dev/null
            iconutil -c icns "$app_contents/Resources/AppIcon.iconset" -o "$app_contents/Resources/AppIcon.icns"
            cat > "$app_contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>${APP_NAME}</string>
            <key>CFBundleIdentifier</key><string>com.void.${APP_SLUG}</string>
            <key>CFBundleName</key><string>${APP_NAME}</string>
            <key>CFBundleDisplayName</key><string>${APP_NAME}</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>${APP_VERSION}</string>
            <key>CFBundleVersion</key><string>${APP_VERSION}</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          EOF
            echo -n 'APPL????' > "$app_contents/PkgInfo"
          fi

          info_plist="dmg_staging/${APP_NAME}.app/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :NSCameraUsageDescription string VOID needs camera access for websites you choose to use.' "$info_plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c 'Set :NSCameraUsageDescription VOID needs camera access for websites you choose to use.' "$info_plist"
          /usr/libexec/PlistBuddy -c 'Add :NSMicrophoneUsageDescription string VOID needs microphone access for websites you choose to use.' "$info_plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c 'Set :NSMicrophoneUsageDescription VOID needs microphone access for websites you choose to use.' "$info_plist"
          codesign --force --deep --sign - "dmg_staging/${APP_NAME}.app"
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "$APP_NAME" -srcfolder dmg_staging -ov -format UDZO "output/${APP_SLUG}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.configure.outputs.app_slug }}-macos-dmg
          path: output/*.dmg
          if-no-files-found: error

  build-windows:
    name: Windows ${{ matrix.format }}
    if: ${{ inputs.build_windows }}
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        format: ${{ fromJSON(inputs.windows_format == 'both' && '["exe","msi"]' || format('["{0}"]', inputs.windows_format)) }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure app metadata
        id: configure
        env:
          APP_NAME: ${{ inputs.app_name }}
          TARGET_URL: ${{ inputs.target_url }}
          ANDROID_PACKAGE: ${{ inputs.android_package }}
          ICON_URL: ${{ inputs.icon_url }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
          APP_NEW_WINDOW: ${{ inputs.new_window }}
        run: node scripts/configure-build.mjs

      - name: Discover and prepare app icon
        env:
          TARGET_URL: ${{ inputs.target_url }}
          ICON_URL: ${{ inputs.icon_url }}
        run: node scripts/prepare-branding.mjs

      - name: Install Rust stable toolchain
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows

      - name: Set up MSVC and Windows SDK tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install cargo-wix
        if: ${{ matrix.format == 'msi' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix

      - name: Ensure WiX Toolset is available
        if: ${{ matrix.format == 'msi' }}
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $wixBin = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'WiX Toolset v3.14\bin'
            if (Test-Path (Join-Path $wixBin 'candle.exe')) { Add-Content $env:GITHUB_PATH $wixBin }
            else { throw 'WiX Toolset 3.14 is unavailable on this runner.' }
          }

      - name: Build Windows binary with embedded icon
        run: cargo build --release --bin void

      - name: Package Windows executable
        if: ${{ matrix.format == 'exe' }}
        env:
          APP_SLUG: ${{ steps.configure.outputs.app_slug }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force output | Out-Null
          Copy-Item target/release/void.exe "output/$env:APP_SLUG.exe"

      - name: Package Windows MSI
        if: ${{ matrix.format == 'msi' }}
        env:
          APP_NAME: ${{ steps.configure.outputs.app_name }}
          APP_SLUG: ${{ steps.configure.outputs.app_slug }}
        shell: bash
        run: |
          mkdir -p output
          cargo wix init --force --product-name "$APP_NAME" --product-icon branding/app.ico
          cargo wix --no-build --nocapture --output "output/${APP_SLUG}.msi"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.configure.outputs.app_slug }}-windows-${{ matrix.format }}
          path: output/*
          if-no-files-found: error

  build-linux:
    name: Linux ${{ matrix.format }}
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        format: ${{ fromJSON(inputs.linux_format == 'both' && '["deb","appimage"]' || format('["{0}"]', inputs.linux_format)) }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure app metadata
        id: configure
        env:
          APP_NAME: ${{ inputs.app_name }}
          TARGET_URL: ${{ inputs.target_url }}
          ANDROID_PACKAGE: ${{ inputs.android_package }}
          ICON_URL: ${{ inputs.icon_url }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
          APP_NEW_WINDOW: ${{ inputs.new_window }}
        run: node scripts/configure-build.mjs

      - name: Discover and prepare app icon
        env:
          TARGET_URL: ${{ inputs.target_url }}
          ICON_URL: ${{ inputs.icon_url }}
        run: node scripts/prepare-branding.mjs

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libwebkit2gtk-4.1-dev

      - name: Install AppImage tools
        if: ${{ matrix.format == 'appimage' }}
        run: sudo apt-get install -y libfuse2 imagemagick

      - name: Install Rust stable toolchain
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux

      - name: Install cargo-deb
        if: ${{ matrix.format == 'deb' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Build Linux binary
        run: cargo build --release --bin void

      - name: Package Debian archive
        if: ${{ matrix.format == 'deb' }}
        env:
          APP_SLUG: ${{ steps.configure.outputs.app_slug }}
        run: |
          mkdir -p output
          cargo deb --no-build -p void -o "output/${APP_SLUG}.deb"

      - name: Package Linux AppImage
        if: ${{ matrix.format == 'appimage' }}
        env:
          APP_NAME: ${{ steps.configure.outputs.app_name }}
          APP_SLUG: ${{ steps.configure.outputs.app_slug }}
        run: |
          set -euo pipefail
          mkdir -p output AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/void "AppDir/usr/bin/${APP_SLUG}"
          cp void.json AppDir/usr/bin/void.json
          convert branding/icon.png -resize 256x256 "AppDir/${APP_SLUG}.png"
          cp "AppDir/${APP_SLUG}.png" "AppDir/usr/share/icons/hicolor/256x256/apps/${APP_SLUG}.png"
          cat > "AppDir/${APP_SLUG}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${APP_NAME}
          Exec=${APP_SLUG}
          Icon=${APP_SLUG}
          Categories=Utility;Network;
          Terminal=false
          EOF
          cp "AppDir/${APP_SLUG}.desktop" AppDir/usr/share/applications/
          cat > AppDir/AppRun <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\$0")")"
          exec "\$HERE/usr/bin/${APP_SLUG}" "\$@"
          EOF
          chmod +x "AppDir/usr/bin/${APP_SLUG}" AppDir/AppRun
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "output/${APP_SLUG}.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.configure.outputs.app_slug }}-linux-${{ matrix.format }}
          path: output/*
          if-no-files-found: error

  build-android:
    name: Android APK
    if: ${{ inputs.build_android }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Configure app metadata
        id: configure
        env:
          APP_NAME: ${{ inputs.app_name }}
          TARGET_URL: ${{ inputs.target_url }}
          ANDROID_PACKAGE: ${{ inputs.android_package }}
          ICON_URL: ${{ inputs.icon_url }}
          APP_WIDTH: ${{ inputs.width }}
          APP_HEIGHT: ${{ inputs.height }}
          APP_VERSION: ${{ inputs.version }}
          APP_FULLSCREEN: ${{ inputs.fullscreen }}
          APP_NEW_WINDOW: ${{ inputs.new_window }}
        run: node scripts/configure-build.mjs

      - name: Discover and prepare app icon
        env:
          TARGET_URL: ${{ inputs.target_url }}
          ICON_URL: ${{ inputs.icon_url }}
        run: node scripts/prepare-branding.mjs

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust stable toolchain
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: android

      - name: Install cargo-apk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-apk

      - name: Build and package Android APK
        env:
          # This is Wry's generated JNI namespace, not the installed application ID.
          WRY_ANDROID_PACKAGE: com.void.void_engine
          WRY_ANDROID_LIBRARY: void
          CARGO_APK_RELEASE_KEYSTORE: /home/runner/.android/debug.keystore
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: android
          APP_SLUG: ${{ steps.configure.outputs.app_slug }}
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          if [ ! -d "$ANDROID_HOME/platforms/android-33" ] \
            || [ ! -x "$ANDROID_HOME/build-tools/34.0.0/d8" ] \
            || [ ! -x "$ANDROID_HOME/build-tools/34.0.0/zipalign" ] \
            || [ ! -x "$ANDROID_HOME/build-tools/34.0.0/apksigner" ]; then
            (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-33" "build-tools;34.0.0"
          fi
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          cargo apk build --lib --release
          bash scripts/package-android-apk.sh target/release/apk/void.apk
          mkdir -p output
          cp target/release/apk/void.apk "output/${APP_SLUG}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.configure.outputs.app_slug }}-android-apk
          path: output/*.apk
          if-no-files-found: error
