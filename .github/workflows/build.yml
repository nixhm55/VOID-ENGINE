name: Build Void Engine

on:
  workflow_dispatch:
    inputs:
      # 1. Targets
      build_macos:
        description: 'Target: macOS'
        required: false
        type: boolean
        default: true
      build_windows:
        description: 'Target: Windows'
        required: false
        type: boolean
        default: false
      build_linux:
        description: 'Target: Linux'
        required: false
        type: boolean
        default: false
      build_android:
        description: 'Target: Android'
        required: false
        type: boolean
        default: false

      # 2. Core Settings
      url:
        description: 'Application URL (Optional - leave empty to load local bundle)'
        required: false
        default: ''
        type: string
      app_name:
        description: 'Application Name (lowercase recommended for Linux)'
        required: true
        default: 'void'
        type: string
      icon_url:
        description: 'Icon URL (.png or .ico) (Optional)'
        required: false
        default: ''
        type: string
      width:
        description: 'Window Width'
        required: true
        default: '1200'
        type: string
      height:
        description: 'Window Height'
        required: true
        default: '780'
        type: string
      version:
        description: 'Application Version'
        required: true
        default: '1.0.0'
        type: string

      # 3. Extra Options
      fullscreen:
        description: 'Start in fullscreen mode'
        required: false
        type: boolean
        default: false
      hide_title_bar:
        description: 'Hide title bar (macOS only)'
        required: false
        type: boolean
        default: false
      new_window:
        description: 'Enable opening target links in new window'
        required: false
        type: boolean
        default: false
      multi_arch:
        description: 'Build Universal Binary (x86_64 + aarch64, macOS only)'
        required: false
        type: boolean
        default: false
      windows_format:
        description: 'Windows package format'
        required: true
        type: choice
        options:
          - exe
          - msi
          - both
        default: exe
      linux_format:
        description: 'Linux package format'
        required: true
        type: choice
        options:
          - deb
          - appimage
          - both
        default: deb

jobs:
  build-macos:
    name: Build macOS (.dmg)
    if: ${{ github.event.inputs.build_macos == 'true' }}
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust Stable Toolchain
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ github.event.inputs.multi_arch == 'true' && 'x86_64-apple-darwin,aarch64-apple-darwin' || '' }}

      - name: Cache Cargo Binaries & Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-rust-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ steps.rust.outputs.cachekey }}-
            ${{ runner.os }}-rust-

      - name: Install cargo-bundle
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle

      - name: Configure void.json & App Metadata
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            let cfg = {};
            try { cfg = JSON.parse(fs.readFileSync("void.json", "utf8")); } catch(e) {}
            const inputUrl = "${{ github.event.inputs.url }}".trim();
            cfg.title = "${{ github.event.inputs.app_name }}";
            cfg.url = inputUrl;
            if (inputUrl) { delete cfg.assets; }
            cfg.width = Number("${{ github.event.inputs.width }}") || 1200;
            cfg.height = Number("${{ github.event.inputs.height }}") || 780;
            cfg.fullscreen = ${{ github.event.inputs.fullscreen }};
            cfg.hide_title_bar = ${{ github.event.inputs.hide_title_bar }};
            cfg.new_window = ${{ github.event.inputs.new_window }};
            fs.writeFileSync("void.json", JSON.stringify(cfg, null, 2));
          '

      - name: Compile macOS Binary
        shell: bash
        run: |
          if [ "${{ github.event.inputs.multi_arch }}" = "true" ]; then
            cargo build --release --bin void --target x86_64-apple-darwin
            cargo build --release --bin void --target aarch64-apple-darwin
            mkdir -p target/release
            lipo -create -output target/release/void \
              target/x86_64-apple-darwin/release/void \
              target/aarch64-apple-darwin/release/void
          else
            cargo build --release --bin void
          fi

      - name: Package macOS .app Bundle & Wrap into .dmg
        shell: bash
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          APP_VERSION="${{ github.event.inputs.version }}"
          mkdir -p output dmg_staging

          if command -v cargo-bundle >/dev/null 2>&1 && cargo bundle --release --bin void --format osx; then
            BUNDLE_PATH=$(find target/release/bundle/osx -maxdepth 1 -name "*.app" | head -n 1)
            cp -R "$BUNDLE_PATH" "dmg_staging/${APP_NAME}.app"
            mkdir -p "dmg_staging/${APP_NAME}.app/Contents/Resources"
            cp void.json "dmg_staging/${APP_NAME}.app/Contents/Resources/void.json"
            cp void.json "dmg_staging/${APP_NAME}.app/Contents/MacOS/void.json"
          else
            APP_DIR="dmg_staging/${APP_NAME}.app/Contents"
            mkdir -p "${APP_DIR}/MacOS" "${APP_DIR}/Resources"
            cp target/release/void "${APP_DIR}/MacOS/${APP_NAME}"
            cp void.json "${APP_DIR}/MacOS/void.json"
            cp void.json "${APP_DIR}/Resources/void.json"
            chmod +x "${APP_DIR}/MacOS/${APP_NAME}"
            cat > "${APP_DIR}/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key>
            <string>${APP_NAME}</string>
            <key>CFBundleIdentifier</key>
            <string>com.void.${APP_NAME}</string>
            <key>CFBundleName</key>
            <string>${APP_NAME}</string>
            <key>CFBundleDisplayName</key>
            <string>${APP_NAME}</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>${APP_VERSION}</string>
            <key>CFBundleVersion</key>
            <string>${APP_VERSION}</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          EOF
            echo -n "APPL????" > "${APP_DIR}/PkgInfo"
          fi

          codesign --force --deep --sign - "dmg_staging/${APP_NAME}.app"
          ln -s /Applications dmg_staging/Applications

          hdiutil create \
            -volname "${APP_NAME}" \
            -srcfolder dmg_staging \
            -ov \
            -format UDZO \
            "output/${APP_NAME}.dmg"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.inputs.app_name }}-macos-dmg
          path: output/*.dmg
          if-no-files-found: error

  build-windows:
    name: Build Windows (.exe / .msi)
    if: ${{ github.event.inputs.build_windows == 'true' }}
    runs-on: windows-2025
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust Stable Toolchain
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Binaries & Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-rust-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ steps.rust.outputs.cachekey }}-
            ${{ runner.os }}-rust-

      - name: Install cargo-wix
        if: ${{ github.event.inputs.windows_format == 'msi' || github.event.inputs.windows_format == 'both' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-wix

      - name: Ensure WiX Toolset in PATH
        if: ${{ github.event.inputs.windows_format == 'msi' || github.event.inputs.windows_format == 'both' }}
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            $programFilesX86 = [Environment]::GetFolderPath("ProgramFilesX86")
            $wixBin = Join-Path $programFilesX86 "WiX Toolset v3.14\bin"
            if (Test-Path (Join-Path $wixBin "candle.exe")) {
              Add-Content -Path $env:GITHUB_PATH -Value $wixBin
            } else {
              throw "WiX Toolset 3.14 was not found on the Windows 2025 runner."
            }
          }

      - name: Configure void.json
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            let cfg = {};
            try { cfg = JSON.parse(fs.readFileSync("void.json", "utf8")); } catch(e) {}
            const inputUrl = "${{ github.event.inputs.url }}".trim();
            cfg.title = "${{ github.event.inputs.app_name }}";
            cfg.url = inputUrl;
            if (inputUrl) { delete cfg.assets; }
            cfg.width = Number("${{ github.event.inputs.width }}") || 1200;
            cfg.height = Number("${{ github.event.inputs.height }}") || 780;
            cfg.fullscreen = ${{ github.event.inputs.fullscreen }};
            cfg.new_window = ${{ github.event.inputs.new_window }};
            fs.writeFileSync("void.json", JSON.stringify(cfg, null, 2));
          '

      - name: Build Windows Binary
        shell: bash
        run: cargo build --release --bin void

      - name: Package Windows Artifacts (.exe and/or .msi)
        shell: bash
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          FORMAT="${{ github.event.inputs.windows_format }}"
          mkdir -p output

          if [ "$FORMAT" = "exe" ] || [ "$FORMAT" = "both" ]; then
            cp target/release/void.exe "output/${APP_NAME}.exe"
          fi

          if [ "$FORMAT" = "msi" ] || [ "$FORMAT" = "both" ]; then
            cargo wix init --force
            cargo wix --no-build --nocapture --output "output/${APP_NAME}.msi"
          fi

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.inputs.app_name }}-windows
          path: |
            output/*.exe
            output/*.msi
          if-no-files-found: error

  build-linux:
    name: Build Linux (.deb / .AppImage)
    if: ${{ github.event.inputs.build_linux == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential

      - name: Install Linux AppImage Tools
        if: ${{ github.event.inputs.linux_format == 'appimage' || github.event.inputs.linux_format == 'both' }}
        run: sudo apt-get install -y libfuse2 imagemagick

      - name: Install Rust Stable Toolchain
        id: rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Binaries & Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-ubuntu-24.04-rust-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-rust-${{ steps.rust.outputs.cachekey }}-
            ${{ runner.os }}-ubuntu-24.04-rust-

      - name: Install Linux Packaging Tools
        if: ${{ github.event.inputs.linux_format == 'deb' || github.event.inputs.linux_format == 'both' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Configure void.json
        run: |
          node -e '
            const fs = require("fs");
            let cfg = {};
            try { cfg = JSON.parse(fs.readFileSync("void.json", "utf8")); } catch(e) {}
            const inputUrl = "${{ github.event.inputs.url }}".trim();
            cfg.title = "${{ github.event.inputs.app_name }}";
            cfg.url = inputUrl;
            if (inputUrl) { delete cfg.assets; }
            cfg.width = Number("${{ github.event.inputs.width }}") || 1200;
            cfg.height = Number("${{ github.event.inputs.height }}") || 780;
            cfg.fullscreen = ${{ github.event.inputs.fullscreen }};
            cfg.new_window = ${{ github.event.inputs.new_window }};
            fs.writeFileSync("void.json", JSON.stringify(cfg, null, 2));
          '

      - name: Build Linux Binary
        run: cargo build --release --bin void

      - name: Package Linux Artifacts (.deb and/or .AppImage)
        run: |
          APP_NAME="${{ github.event.inputs.app_name }}"
          FORMAT="${{ github.event.inputs.linux_format }}"
          mkdir -p output

          if [ "$FORMAT" = "deb" ] || [ "$FORMAT" = "both" ]; then
            cargo deb --no-build -p void -o "output/${APP_NAME}.deb"
          fi

          if [ "$FORMAT" = "appimage" ] || [ "$FORMAT" = "both" ]; then
            mkdir -p AppDir/usr/bin AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
            cp target/release/void "AppDir/usr/bin/${APP_NAME}"
            cp void.json "AppDir/usr/bin/void.json"
            chmod +x "AppDir/usr/bin/${APP_NAME}"

            if [ -n "${{ github.event.inputs.icon_url }}" ]; then
              curl -sSL "${{ github.event.inputs.icon_url }}" -o raw_icon.png && convert raw_icon.png -resize 256x256 "AppDir/${APP_NAME}.png" || convert -size 256x256 xc:#4f46e5 "AppDir/${APP_NAME}.png"
            else
              convert -size 256x256 xc:#4f46e5 "AppDir/${APP_NAME}.png"
            fi
            cp "AppDir/${APP_NAME}.png" "AppDir/usr/share/icons/hicolor/256x256/apps/${APP_NAME}.png"

            cat > "AppDir/${APP_NAME}.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=${APP_NAME}
          Exec=${APP_NAME}
          Icon=${APP_NAME}
          Categories=Utility;Network;
          EOF
            cp "AppDir/${APP_NAME}.desktop" "AppDir/usr/share/applications/${APP_NAME}.desktop"

            cat > "AppDir/AppRun" <<EOF
          #!/bin/sh
          HERE="\$(dirname "\$(readlink -f "\${0}")")"
          exec "\${HERE}/usr/bin/${APP_NAME}" "\$@"
          EOF
            chmod +x "AppDir/AppRun"

            wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
            chmod +x appimagetool
            ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "output/${APP_NAME}.AppImage"
          fi

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.inputs.app_name }}-linux
          path: |
            output/*.deb
            output/*.AppImage
          if-no-files-found: error

  build-android:
    name: Build Android (.apk)
    if: ${{ github.event.inputs.build_android == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Java (Required for Android SDK)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Rust & Android Targets
        id: rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Cargo Binaries & Dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-ubuntu-24.04-android-rust-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ubuntu-24.04-android-rust-${{ steps.rust.outputs.cachekey }}-
            ${{ runner.os }}-ubuntu-24.04-android-rust-

      - name: Install cargo-apk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-apk

      - name: Configure void.json
        run: |
          node -e '
            const fs = require("fs");
            let cfg = {};
            try { cfg = JSON.parse(fs.readFileSync("void.json", "utf8")); } catch(e) {}
            const inputUrl = "${{ github.event.inputs.url }}".trim();
            cfg.title = "${{ github.event.inputs.app_name }}";
            cfg.url = inputUrl;
            if (inputUrl) { delete cfg.assets; }
            cfg.fullscreen = ${{ github.event.inputs.fullscreen }};
            fs.writeFileSync("void.json", JSON.stringify(cfg, null, 2));
            fs.writeFileSync("dist/void.json", JSON.stringify(cfg, null, 2));
          '

      - name: Build Android APK
        env:
          WRY_ANDROID_PACKAGE: "com.void.void_engine"
          WRY_ANDROID_LIBRARY: "void"
          CARGO_APK_RELEASE_KEYSTORE: "/home/runner/.android/debug.keystore"
          CARGO_APK_RELEASE_KEYSTORE_PASSWORD: "android"
        run: |
          export NDK_HOME=$ANDROID_NDK_LATEST_HOME

          if [ ! -d "$ANDROID_HOME/platforms/android-33" ] || [ ! -x "$ANDROID_HOME/build-tools/33.0.2/aapt" ]; then
            (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platforms;android-33" "build-tools;33.0.2"
          fi

          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

          cargo apk build --lib --release

          rm -f target/release/apk/*unaligned*.apk
          mkdir -p output
          cp target/release/apk/void.apk "output/${{ github.event.inputs.app_name }}.apk"

      - name: Upload Android APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.inputs.app_name }}-android-apk
          path: output/*.apk
          if-no-files-found: error
