[package]
name = "void"
version = "0.1.0"
edition = "2021"
authors = ["Void Engine <support@void.com>"]
description = "Void Engine - Lightweight cross-platform desktop and mobile web wrapper"
license = "MIT"
build = false

[features]
default = ["lite"]
lite = []
geolocation = []
bluetooth = ["dep:btleplug", "dep:tokio", "dep:futures-util", "dep:rfd", "dep:uuid"]
max = ["lite", "geolocation", "bluetooth"]

[package.metadata.bundle]
name = "VOID"
identifier = "com.void.void"
version = "1.0.0"
short_description = "Void Engine Web Wrapper"

[package.metadata.deb]
name = "void"
maintainer = "Void Engine Developers <dev@void.local>"
copyright = "2026, Void Engine"
depends = "$auto"
section = "web"
priority = "optional"
assets = [
    ["target/release/void", "usr/bin/", "755"],
]

[lib]
name = "void"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "void"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.37"
wry = "0.57"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
log = "0.4"
ndk = "0.9"
ndk-context = "0.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
btleplug = { version = "0.13.5", optional = true }
tokio = { version = "1.53", features = ["rt-multi-thread", "time"], optional = true }
futures-util = { version = "0.3", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
rfd = { version = "0.17.2", default-features = false, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["common-controls-v6"], optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.17.2", default-features = false, features = ["gtk3"], optional = true }

[package.metadata.android]
package = "com.void.void"
apk_name = "void"
assets = "dist"
strip = "strip"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 24
target_sdk_version = 33

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"

[[package.metadata.android.uses_permission]]
name = "android.permission.CAMERA"

[[package.metadata.android.uses_permission]]
name = "android.permission.RECORD_AUDIO"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_COARSE_LOCATION"

[[package.metadata.android.uses_permission]]
name = "android.permission.ACCESS_FINE_LOCATION"

[[package.metadata.android.uses_permission]]
name = "android.permission.MODIFY_AUDIO_SETTINGS"

[[package.metadata.android.uses_permission]]
name = "android.permission.WRITE_EXTERNAL_STORAGE"
max_sdk_version = 28

[[package.metadata.android.uses_permission]]
name = "android.permission.POST_NOTIFICATIONS"

[package.metadata.android.application]
label = "VOID"
theme = "@android:style/Theme.Material.NoActionBar"
uses_cleartext_traffic = true
has_code = true

[package.metadata.android.application.activity]
name = "com.mdnm.voidengine.VoidActivity"
exported = true
config_changes = "orientation|keyboardHidden|screenSize"
